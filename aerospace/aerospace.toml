config-version = 2
start-at-login = true
auto-reload-config = false

# Homebrew starts SketchyBar and JankyBorders. AeroSpace only sends events.
after-startup-command = [
    'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change',
    'exec-and-forget "$HOME/.config/aerospace/start-page.py" >> "$HOME/Library/Logs/desktop-start-page.log" 2>&1',
]
exec-on-workspace-change = ['/bin/bash', '-c', '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE="$AEROSPACE_FOCUSED_WORKSPACE"']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
persistent-workspaces = ['1', '2', '3', '4']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_focus_change']
key-mapping.preset = 'qwerty'
focus-follows-mouse.enabled = false
on-window-detected = [{ if = 'true', run = 'layout floating' }]

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.right = 10
outer.bottom = 10
outer.top = [{ monitor.'built-in' = 10 }, 42]

[mode.main.binding]
alt-enter = 'exec-and-forget open -a kitty'
ctrl-alt-cmd-left = 'exec-and-forget "$HOME/.config/aerospace/snap-window" left'
ctrl-alt-cmd-right = 'exec-and-forget "$HOME/.config/aerospace/snap-window" right'
ctrl-alt-cmd-up = 'macos-native-fullscreen on'
ctrl-alt-cmd-down = 'exec-and-forget /opt/homebrew/bin/aerospace macos-native-fullscreen off && "$HOME/.config/aerospace/snap-window" maximize'
ctrl-alt-cmd-shift-h = 'focus left'
ctrl-alt-cmd-shift-j = 'focus down'
ctrl-alt-cmd-shift-k = 'focus up'
ctrl-alt-cmd-shift-l = 'focus right'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-slash = 'layout tiles horizontal vertical'
alt-shift-space = 'layout floating tiling'
alt-f = 'fullscreen'
alt-tab = 'workspace-back-and-forth'
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
