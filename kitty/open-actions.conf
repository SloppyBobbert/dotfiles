# Change directories only at a shell prompt.
protocol file
mime inode/directory
action kitten click-directory.py ${FILE_PATH}

protocol file
ext py,ipynb,md,MD
action launch --type=background /usr/bin/open -a "Visual Studio Code" ${FILE_PATH}

protocol file
ext r,R
action launch --type=background /usr/bin/open -a RStudio ${FILE_PATH}

# Open all other files in Neovim.
protocol file
action launch --type=overlay --cwd=current /opt/homebrew/bin/nvim -- ${FILE_PATH}
