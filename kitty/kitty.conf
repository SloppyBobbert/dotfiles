# ==========================
# Kitty Terminal Config
# ==========================
# Make Kitty see Homebrew-installed binaries
# Make Kitty see Homebrew binaries like nvim
env PATH /opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

shell /bin/zsh
# shell tmux new-session -A -s main


copy_on_select yes
allow_remote_control yes
listen_on unix:/tmp/kitty-rc-$(USER)

# --- Fonts ---
font_family SF Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0

# Mouse support
mouse_hide_wait 3.0

# --- Colors ---
background_opacity 0.95
background_blur 24
dynamic_background_opacity yes
transparent_background_colors #171717@0.95 #222222@1.0 #2A2A2A@1.0
# background #1e1e2e
# foreground #cdd6f4
# cursor #f5c2e7
# selection_foreground #11111b
# selection_background #45475a
# url_color #89b4fa

# --- Tabs ---
#tab_bar_style powerline
#tab_powerline_style slanted

# --- Window padding ---
window_padding_width 2

# --- Scrolling ---
scrollback_lines 10000

# --- Key Mappings ---
# Prefix for custom commands: Ctrl+Shift
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
# Ignored key name: map ctrl+shift+arrow_up increase_font_size
# Ignored key name: map ctrl+shift+arrow_down decrease_font_size
map ctrl+shift+r reload_config

# Use Pi's image-or-text paste without changing paste in other windows.
map --when-focus-on=title:^π cmd+v send_key ctrl+v

# --- Splits ---
map ctrl+shift+h previous_window
map ctrl+shift+l next_window
map ctrl+shift+v new_window_vertical
map ctrl+shift+s new_window_horizontal
map cmd+t launch --type=tab --cwd=current


# New (opens in same dir):
map cmd+return launch --location=hsplit --cwd=current

# Navigate tabs like browser tabs
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9



# --- Config Reload ---
map cmd+shift+r load_config_file

# --- Misc ---
enable_audio_bell no
hide_window_decorations no

# TMUX
#
map ctrl+a send_text all \x01

# --- Performance ---
repaint_delay 1
input_delay 3
sync_to_monitor no



# BEGIN_KITTY_THEME
# Noir Neutral
include current-theme.conf
# END_KITTY_THEME
#
# ============================================
# Tab settings - MUST be AFTER theme to override
# ============================================
tab_bar_style fade
tab_bar_edge top
tab_bar_min_tabs 1
# Unsupported option: show_tab_bar yes

# SHOW TAB INDEX - this is the important part!
# Unsupported option: show_tab_index yes
tab_title_template "{sup.index}  {title[:40] if is_active else title[:15]}"
